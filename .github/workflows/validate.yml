# Runs every gate on push and pull requests: lint, data validation, the full
# node test suites, and the production build. No test framework or browser is
# needed — all gates run headless in Node (see scripts/test-e2e.mjs header).
name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate
      - run: npm test
      - run: npm run build
